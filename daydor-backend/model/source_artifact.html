<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daydor — Data Model & Access Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --paper:#F3F4F0; --raised:#FBFBF8; --sunk:#E7E9E2; --ink:#1A1D25; --soft:#4A4F5E; --faint:#7C8190; --hair:#D4D7CE;
  --accent:#2F6E68; --accent-soft:#DFEBE8;
  --d-ro:#556270; --d-priv:#6B6A2C; --d-ref:#857F72; --d-hr:#6E56A8; --d-ta:#A34E7E; --d-ob:#2F6E68; --d-it:#2F6E9E;
  --d-pay:#2F8A5E; --d-ben:#3E7CB1; --d-time:#5E8C3E; --d-comp:#9A7B2E; --d-perf:#7A5CA8; --d-learn:#3E8C82; --d-fin:#B58323; --d-er:#A15A3E;
  --c-S:#9AA0A6; --c-C0:#6F8F8B; --c-C1:#3F7CA8; --c-C2:#B58323; --c-C3:#C0553A; --c-C4:#7B3F8F;
  --lv0:transparent; --lv1:rgba(47,110,104,.16); --lv2:rgba(47,110,104,.34); --lv3:rgba(47,110,104,.62); --lv4:#2F6E68;
  --lvtext:#fff; --shadow:rgba(26,29,37,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171C; --raised:#1C1F26; --sunk:#252932; --ink:#ECEAE3; --soft:#B5B8C3; --faint:#848997; --hair:#343844;
  --accent:#72C2B8; --accent-soft:#1D302D;
  --d-ro:#A9B3BF; --d-priv:#C9C77A; --d-ref:#B9B2A3; --d-hr:#C0AEE0; --d-ta:#E6A8CB; --d-ob:#6FBDB4; --d-it:#8DC1EA;
  --d-pay:#8FDCB0; --d-ben:#9BC4EE; --d-time:#A9D687; --d-comp:#DABE6E; --d-perf:#C1AAE6; --d-learn:#85D2C6; --d-fin:#E5C078; --d-er:#E3A17E;
  --c-S:#7E848D; --c-C0:#98B9B4; --c-C1:#7FB3DA; --c-C2:#E2BF6A; --c-C3:#EC8B6E; --c-C4:#C595D6;
  --lv1:rgba(114,194,184,.16); --lv2:rgba(114,194,184,.32); --lv3:rgba(114,194,184,.58); --lv4:#72C2B8; --lvtext:#10201E; --shadow:rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#15171C; --raised:#1C1F26; --sunk:#252932; --ink:#ECEAE3; --soft:#B5B8C3; --faint:#848997; --hair:#343844;
  --accent:#72C2B8; --accent-soft:#1D302D;
  --d-ro:#A9B3BF; --d-priv:#C9C77A; --d-ref:#B9B2A3; --d-hr:#C0AEE0; --d-ta:#E6A8CB; --d-ob:#6FBDB4; --d-it:#8DC1EA;
  --d-pay:#8FDCB0; --d-ben:#9BC4EE; --d-time:#A9D687; --d-comp:#DABE6E; --d-perf:#C1AAE6; --d-learn:#85D2C6; --d-fin:#E5C078; --d-er:#E3A17E;
  --c-S:#7E848D; --c-C0:#98B9B4; --c-C1:#7FB3DA; --c-C2:#E2BF6A; --c-C3:#EC8B6E; --c-C4:#C595D6;
  --lv1:rgba(114,194,184,.16); --lv2:rgba(114,194,184,.32); --lv3:rgba(114,194,184,.58); --lv4:#72C2B8; --lvtext:#10201E; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:flex-end;padding:.9rem 1.1rem .7rem;background:var(--raised);border-bottom:1px solid var(--hair)}
.brand{margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.brand p{margin:.1rem 0 0;color:var(--soft);font-size:.82rem;max-width:70ch}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.ctl{display:flex;flex-direction:column;gap:.15rem}
.ctl label{font-size:.7rem;color:var(--faint)}
.ctl select,.ctl input{background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:.32rem .5rem;font-size:.82rem;min-width:0}
.ctl input{width:170px}
nav.tabs{display:flex;gap:.2rem;padding:0 1.1rem;background:var(--raised);border-bottom:1px solid var(--hair);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.55rem .8rem;font-size:.86rem;color:var(--soft);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.body{flex:1 1 auto;display:flex;min-height:0}
.stage{flex:1 1 auto;min-width:0;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none;overflow:auto}
.pane.on{display:block}
#pane-schema{overflow:hidden}
aside.inspector{flex:0 0 420px;border-left:1px solid var(--hair);background:var(--raised);overflow:auto;padding:1rem 1.1rem 2rem}
svg#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#graph:active{cursor:grabbing}
.cl-label{font-size:12px;font-weight:600}
.cl-count{font-size:11px;fill:var(--faint)}
.node rect.box{fill:var(--raised);stroke:var(--hair)}
.node text.nm{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink)}
.node text.gl{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500}
.node{cursor:pointer;transition:opacity .15s}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.match rect.box{stroke:var(--c-C2);stroke-width:2}
.edge{fill:none;stroke:var(--faint);stroke-opacity:.28;stroke-width:1}
.edge.hot{stroke:var(--accent);stroke-opacity:.95;stroke-width:1.6}
.edge.dim{stroke-opacity:.06}
.flowpath{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:6 4}
.badge circle{fill:var(--accent)}
.badge text{fill:var(--lvtext);font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.overlay{position:absolute;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.overlay.tl{left:.8rem;top:.8rem}
.leg{display:flex;gap:.3rem .8rem;flex-wrap:wrap;align-items:center;background:var(--raised);border:1px solid var(--hair);border-radius:6px;padding:.3rem .6rem;font-size:.74rem;color:var(--soft)}
.overlay.tl{right:.8rem}
.overlay.bl{left:.8rem;bottom:.8rem;background:var(--raised);border:1px solid var(--hair);border-radius:8px;padding:.5rem .7rem;font-size:.74rem;color:var(--soft);flex-direction:column;align-items:flex-start;gap:.25rem;max-width:300px;box-shadow:0 2px 10px var(--shadow)}
.btn{border:1px solid var(--hair);background:var(--raised);color:var(--soft);border-radius:6px;padding:.3rem .6rem;font-size:.78rem;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip-trace{background:var(--accent);color:var(--lvtext);border-radius:6px;padding:.3rem .6rem;font-size:.78rem;border:0;cursor:pointer}
.legend-row{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:.25rem}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:.3rem;border:1px solid var(--hair)}
.lv2pat{background-image:repeating-linear-gradient(45deg,var(--lv3) 0 2px,transparent 2px 5px)}
/* inspector */
.insp h2{margin:0;font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:500;word-break:break-all}
.insp .meta{display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0 .6rem}
.tag{font-size:.72rem;border:1px solid var(--hair);border-radius:999px;padding:.08rem .5rem;color:var(--soft);background:var(--paper)}
.tag.dom{border-color:transparent;color:var(--lvtext)}
.insp p.desc{margin:.2rem 0 .8rem;color:var(--soft);font-size:.85rem;max-width:62ch}
.insp h3{font-size:.8rem;font-weight:600;margin:1.1rem 0 .4rem;color:var(--ink)}
.coltbl{width:100%;border-collapse:collapse;font-size:.76rem}
.coltbl th{font-weight:500;color:var(--faint);text-align:left;padding:.15rem .2rem;border-bottom:1px solid var(--hair);font-size:.68rem}
.coltbl td{padding:.22rem .2rem;border-bottom:1px solid var(--hair);vertical-align:middle}
.coltbl td.cn{font-family:"IBM Plex Mono",monospace;word-break:break-all}
.coltbl td.ct{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:.7rem}
.coltbl th.r,.coltbl td.r{width:15px;padding:.1rem 1px;text-align:center}
.cell{display:block;width:13px;height:13px;border-radius:2px;margin:auto;border:1px solid var(--hair)}
.cl{font-size:.66rem;font-weight:600;border-radius:3px;padding:0 .25rem;color:var(--lvtext)}
.flag{font-size:.62rem;color:var(--faint);margin-left:.25rem}
.coltbl tr.lensrow td{background:var(--accent-soft)}
.list{margin:0;padding:0;list-style:none;font-size:.8rem}
.list li{padding:.18rem 0;border-bottom:1px dashed var(--hair)}
.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font-family:"IBM Plex Mono",monospace;font-size:.78rem}
.wk{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.7rem;border:1px solid var(--hair);border-radius:4px;padding:.02rem .35rem;margin:.12rem .15rem 0 0;background:var(--paper)}
.wk.w{border-color:var(--accent);color:var(--accent)}
pre.ddl{background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:.6rem;font-size:.7rem;overflow-x:auto;white-space:pre;line-height:1.45}
details summary{cursor:pointer;font-size:.8rem;font-weight:600;margin-top:1rem}
.gate{border-left:3px solid var(--c-C3);padding:.25rem .5rem;margin:.3rem 0;background:var(--paper);font-size:.78rem}
.rolecard{background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:.6rem .7rem;font-size:.8rem;margin-top:.6rem}
/* access */
.access-wrap{padding:1rem 1.2rem 2rem;max-width:1180px}
.section-h{font-size:1rem;font-weight:600;margin:0 0 .25rem}
.section-p{margin:0 0 .9rem;color:var(--soft);font-size:.85rem;max-width:78ch}
.ladder{display:grid;grid-template-columns:150px 1fr;gap:.45rem .8rem;align-items:center;margin-bottom:1.4rem}
.ladder .tier{font-size:.74rem;color:var(--faint);text-align:right}
.ladder .roles{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.rchip{border:1px solid var(--hair);background:var(--raised);border-radius:6px;padding:.28rem .6rem;font-size:.8rem;cursor:pointer}
.rchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rchip small{color:var(--faint);margin-left:.3rem;font-size:.7rem}
.arrow{color:var(--faint);font-size:.8rem}
.caps{border-collapse:collapse;font-size:.78rem;margin-bottom:1.5rem}
.caps th,.caps td{padding:.25rem .45rem;border:1px solid var(--hair);text-align:center}
.caps th{font-weight:500;background:var(--raised)}
.caps td.rl{text-align:left;white-space:nowrap}
.lvcell{display:inline-flex;align-items:center;justify-content:center;width:28px;height:20px;border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600}
.matrix-scroll{overflow:auto;border:1px solid var(--hair);border-radius:8px;max-height:72vh;background:var(--raised)}
table.matrix{border-collapse:separate;border-spacing:0;font-size:.76rem}
table.matrix th{position:sticky;top:0;background:var(--raised);z-index:2;font-weight:500;padding:.4rem .2rem;border-bottom:1px solid var(--hair);font-size:.7rem;color:var(--soft);vertical-align:bottom;min-width:46px;line-height:1.2}
table.matrix th.tn{left:0;z-index:3;text-align:left;min-width:210px;padding-left:.6rem}
table.matrix td{padding:2px 3px;border-bottom:1px solid var(--hair);text-align:center}
table.matrix td.tn{position:sticky;left:0;background:var(--raised);text-align:left;font-family:"IBM Plex Mono",monospace;padding-left:.6rem;z-index:1;white-space:nowrap}
table.matrix tr.grp td{background:var(--sunk);font-family:inherit;font-weight:600;font-size:.74rem;text-align:left;padding:.3rem .6rem;position:sticky;left:0}
table.matrix td.c button{width:38px;height:20px;border-radius:3px;border:1px solid var(--hair);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:600;padding:0}
table.matrix tr.selrow td.tn{color:var(--accent);font-weight:500}
table.matrix th.lenscol,table.matrix td.lenscol{background:var(--accent-soft)}
/* flows */
.flows{display:grid;grid-template-columns:260px 1fr;gap:1.2rem;padding:1rem 1.2rem 2rem;max-width:1180px}
.flowlist button{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--raised);border-radius:8px;padding:.55rem .7rem;margin-bottom:.45rem;cursor:pointer}
.flowlist button.on{border-color:var(--accent);background:var(--accent-soft)}
.flowlist b{display:block;font-weight:500;font-size:.86rem}
.flowlist span{font-size:.75rem;color:var(--soft)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--hair)}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--lvtext);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps .top{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.op{font-size:.68rem;font-weight:600;border-radius:3px;padding:.02rem .35rem;border:1px solid var(--hair)}
.op.W{background:var(--lv4);color:var(--lvtext);border-color:transparent}
.op.R{background:var(--lv2)}
.op.A{background:var(--c-C3);color:#fff;border-color:transparent}
.steps .note{font-size:.8rem;color:var(--soft);margin-top:.1rem}
.tchip{font-family:"IBM Plex Mono",monospace;font-size:.78rem;border:0;background:none;padding:0;cursor:pointer;border-bottom:2px solid;color:var(--ink)}
/* coverage */
.cov{padding:1rem 1.2rem 2rem;max-width:1100px}
.chart{margin-bottom:1.8rem}
.bars{display:flex;flex-direction:column;gap:.3rem}
.bar{display:grid;grid-template-columns:170px 1fr 34px;gap:.6rem;align-items:center;font-size:.8rem;cursor:pointer;border-radius:4px;padding:.1rem .2rem}
.bar:hover{background:var(--sunk)}
.bar .track{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar .track span{display:block;height:100%}
.bar .n{font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--soft);text-align:right}
.chart .legend-row{font-size:.74rem;color:var(--soft);margin:.4rem 0 0}
.decisions{counter-reset:d;list-style:none;padding:0;margin:0}
.decisions li{padding:.6rem .8rem;border:1px solid var(--hair);border-radius:8px;margin-bottom:.5rem;background:var(--raised);font-size:.84rem}
.decisions li b{font-weight:600}
.decisions li p{margin:.2rem 0 0;color:var(--soft)}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .body{flex-direction:column}
  .stage{height:68vh;flex:0 0 auto}
  aside.inspector{flex:0 0 auto;border-left:0;border-top:1px solid var(--hair)}
  .flows{grid-template-columns:1fr}
  .ladder{grid-template-columns:1fr}.ladder .tier{text-align:left}
  .bar{grid-template-columns:120px 1fr 30px}
  .ctl input{width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Daydor data model and access map</h1>
    <p id="lead"></p>
  </div>
  <div class="controls">
    <div class="ctl"><label for="lens">View as role</label>
      <select id="lens"></select></div>
    <div class="ctl"><label for="juris">Jurisdiction pack</label>
      <select id="juris"><option value="">India + US</option><option value="IN">India only</option><option value="US">US only</option></select></div>
    <div class="ctl"><label for="q">Find a table or column</label>
      <input id="q" type="search" placeholder="e.g. pan, payslip" autocomplete="off"></div>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="schema" aria-selected="true">Schema map</button>
  <button role="tab" data-tab="access" aria-selected="false">Access hierarchy</button>
  <button role="tab" data-tab="flows" aria-selected="false">Data flows</button>
  <button role="tab" data-tab="coverage" aria-selected="false">Coverage and decisions</button>
</nav>
<div class="body">
  <div class="stage">
    <section class="pane on" id="pane-schema">
      <svg id="graph" aria-label="Entity relationship map"></svg>
      <div class="overlay tl">
        <button class="btn" id="fit">Fit to screen</button>
        <button class="btn on" id="hideEmp" aria-pressed="true">Hide links to employee</button>
        <span id="traceChip"></span>
        <div class="leg" id="legend"></div>
      </div>
    </section>
    <section class="pane" id="pane-access"></section>
    <section class="pane" id="pane-flows"></section>
    <section class="pane" id="pane-coverage"></section>
  </div>
  <aside class="inspector insp" id="insp" aria-live="polite"></aside>
</div>
</div>

<script>
/* =========================================================
   Reference vocabularies
   ========================================================= */
const DOM = {
  ro:{label:'Platform & tenancy'}, priv:{label:'Privacy, audit & evidence'}, ref:{label:'Statutory reference'},
  hr:{label:'Core HR'}, ta:{label:'Talent acquisition'}, ob:{label:'Onboarding'}, it:{label:'IT & identity'},
  pay:{label:'Payroll'}, ben:{label:'Benefits'}, time:{label:'Time & leave'}, comp:{label:'Comp & equity'},
  perf:{label:'Performance'}, learn:{label:'Learning'}, fin:{label:'Finance & spend'}, er:{label:'ER & offboarding'}
};
const DOM_ORDER = ['ro','priv','ref','hr','ta','ob','it','pay','ben','time','comp','perf','learn','fin','er'];
const CLASSES = {
  S:{label:'System',desc:'Keys, status enums, timestamps. Follows the table-level grant.'},
  C0:{label:'Business',desc:'Non-personal company data: plan names, rates, legal entity names.'},
  C1:{label:'Personal',desc:'Identifies a person in a work context: name, work email, dates, title.'},
  C2:{label:'Confidential',desc:'Pay, ratings, balances, equity. Need-to-know.'},
  C3:{label:'Restricted PII',desc:'Aadhaar, PAN, SSN, bank, DOB, addresses, contacts, visa. Encrypted or masked; decrypt per purpose.'},
  C4:{label:'Special category',desc:'Race, disability, veteran, medical reason, ER findings, background findings, garnishments.'}
};
const CLASS_ORDER = ['S','C0','C1','C2','C3','C4'];
const LV = [
  {g:'·',label:'No access'},{g:'Σ',label:'Aggregate only'},{g:'M',label:'Masked'},{g:'R',label:'Read'},{g:'W',label:'Read + write'}
];
const ROLES = [
  {id:'A',name:'Daydor admin',short:'Daydor\nadmin',tier:'Platform',db:'daydor_admin',desc:'Runs the platform: schema, migrations, tenant provisioning. Sees platform metadata and counts, never tenant people data. Break-glass needs two approvers and is fully audited.'},
  {id:'O',name:'Daydor ops',short:'Daydor\nops',tier:'Platform',db:'daydor_ops',desc:'Operates payroll and compliance on the client\u2019s behalf (the managed-service model). Full working access inside assigned tenants only; restricted PII stays masked on screen because agents decrypt it at the moment of use.'},
  {id:'F',name:'Founder / owner',short:'Founder',tier:'Tenant',db:'tenant_founder',desc:'The client company\u2019s approver of record. Sees the whole company and approves money-moving and threshold gates. Restricted PII is masked; special-category data appears only as aggregates.'},
  {id:'H',name:'HR admin',short:'HR\nadmin',tier:'Tenant specialist',db:'tenant_hr',desc:'Client-side people lead. Full Core HR including restricted PII, decrypted per purpose and logged. Special-category data only by designation (EEO officer, ER investigator).'},
  {id:'P',name:'Payroll & finance',short:'Payroll &\nfinance',tier:'Tenant specialist',db:'tenant_payroll',desc:'Runs pay, filings and spend. Sees compensation in full; bank and PAN stay masked because disbursal decrypts inside the worker, not on screen.'},
  {id:'I',name:'IT admin',short:'IT\nadmin',tier:'Tenant specialist',db:'tenant_it',desc:'Identity, app access and devices. Sees who works here and when they start or leave. No pay, no performance, no PII.'},
  {id:'M',name:'People manager',short:'Manager',tier:'Scoped',db:'tenant_manager',desc:'Sees their reporting subtree (direct and indirect) through reporting_closure. Reviews, time, leave and team expenses. Leave reasons and PII hidden; team pay visible only if the tenant enables it.'},

function tblLevel(tb,r){
  if(r==='G' && WK[tb.id]){ if(WK[tb.id][0].length) return 4; if(WK[tb.id][1].length) return Math.max(3, Math.min(3,+tb.acl[9]||3)); }
  if(r==='G' && !WK[tb.id]) return +tb.acl[9];
  return +tb.acl[RID.indexOf(r)];
}
function capOf(tb,r,cl){ return (tb.cap && tb.cap[r] && tb.cap[r][cl]!=null) ? tb.cap[r][cl] : CAPS[r][cl]; }
function colLevel(tb,c,r){ return Math.min(tblLevel(tb,r), capOf(tb,r,c.cl)); }
function visCols(tb){ return tb.cols.filter(c=>!state.j || !c.j || c.j===state.j); }
function effLevel(tb,r){ return Math.max(0,...visCols(tb).map(c=>colLevel(tb,c,r))); }
function visTables(){ return T.filter(tb=>!state.j || !tb.j || tb.j===state.j); }
function maxClass(tb){ let m='S'; visCols(tb).forEach(c=>{ if(CLASS_ORDER.indexOf(c.cl)>CLASS_ORDER.indexOf(m)) m=c.cl; }); return m; }
function empLinked(tb){ return tb.id==='employee' || tb.cols.some(c=>c.fk==='employee'); }
function scopeOf(r,tb){
  if(r==='A') return 'All tenants, metadata';
  if(r==='O') return 'Assigned tenants';
  if(r==='G') return 'Own domain workers';
  if(r==='U') return 'Tenant, time-boxed';
  if(r==='M') return empLinked(tb)?'Reporting subtree':'Tenant';
  if(r==='E') return empLinked(tb)?'Self only':'Tenant';
  return 'Tenant';
}
function lvStyle(l){
  if(l===0) return 'background:var(--paper);color:var(--faint)';
  if(l===1) return 'background:var(--lv1);color:var(--ink)';
  if(l===2) return 'background:var(--lv2);color:var(--ink)';
  if(l===3) return 'background:var(--lv3);color:var(--ink)';
  return 'background:var(--lv4);color:var(--lvtext)';
}
const esc = s => String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function gatesFor(id){ return GATES.filter(g=>g.tables.includes(id)); }
function inbound(id){ const out=[]; T.forEach(tb=>tb.cols.forEach(c=>{ if(c.fk===id) out.push({t:tb.id,c:c.n}); })); return out; }

/* =========================================================
   DDL generator
   ========================================================= */
function sqlType(c){
  return ({uuid:'uuid',text:'text',enum:'text',jsonb:'jsonb',numeric:'numeric(14,2)',date:'date',ts:'timestamptz',bool:'boolean',int:'integer',bytea:'bytea',citext:'citext'})[c.ty]||c.ty;
}
function ddl(tb){
  const cols=visCols(tb), L=[];
  L.push(`-- ${tb.id}: ${DOM[tb.d].label}. Draft generated from this model.`);
  L.push(`CREATE TABLE ${tb.id} (`);
  const defs=cols.map(c=>{
    let s='  '+c.n.padEnd(30)+sqlType(c);
    if(c.pk) s+=' PRIMARY KEY DEFAULT gen_random_uuid()';
    else if(!c.null) s+=' NOT NULL';
    if(c.fk) s+=` REFERENCES ${c.fk}(id)`;
    if(c.uniq && c.n!=='hire_event_id') s+=' UNIQUE';
    if(c.n==='created_at'||c.n==='updated_at') s+=' DEFAULT now()';
    if(c.ty==='enum') s+='  -- enum';
    return s;
  });
  if(cols.some(c=>c.n==='hire_event_id')) defs.push('  UNIQUE (tenant_id, hire_event_id)');
  L.push(defs.join(',\n')); L.push(');');
  cols.forEach(c=>{ L.push(`COMMENT ON COLUMN ${tb.id}.${c.n} IS 'class=${c.cl}${c.enc?';enc=pgcrypto':''}${c.mask?';masked':''}${c.j?';pack='+c.j:''}';`); });
  if(!tb.global){
    L.push('', `ALTER TABLE ${tb.id} ENABLE ROW LEVEL SECURITY;`, `ALTER TABLE ${tb.id} FORCE ROW LEVEL SECURITY;`);
    L.push(`CREATE POLICY tenant_isolation ON ${tb.id}`, `  USING (tenant_id = current_setting('app.tenant_id')::uuid${tb.nullTenant?" OR app.is_daydor_staff()":''});`);
    const ec=cols.find(c=>c.fk==='employee' && c.n!=='current_employee_id' && c.n!=='head_employee_id');
    if(ec) L.push(`CREATE POLICY person_scope ON ${tb.id} AS RESTRICTIVE FOR SELECT`, `  USING (app.can_see_employee(${ec.n}));  -- self, reporting_closure, or tenant-wide role`);
    L.push(`CREATE INDEX ON ${tb.id} (tenant_id${ec?', '+ec.n:''});`);
  }
  if(tb.appendOnly) L.push(`REVOKE UPDATE, DELETE ON ${tb.id} FROM PUBLIC;  -- append-only for every app role`);
  L.push('');
  ['O','F','H','P','I','M','E','U'].forEach(r=>{
    const full=cols.filter(c=>colLevel(tb,c,r)>=3).map(c=>c.n);
    const masked=cols.filter(c=>colLevel(tb,c,r)===2).map(c=>c.n);
    const agg=cols.filter(c=>colLevel(tb,c,r)===1).map(c=>c.n);
    const writable=cols.filter(c=>colLevel(tb,c,r)===4 && !['id','tenant_id','created_at','updated_at'].includes(c.n)).map(c=>c.n);
    if(full.length) L.push(`GRANT SELECT (${full.join(', ')}) ON ${tb.id} TO ${ROLE[r].db};`);
    if(writable.length && !tb.appendOnly) L.push(`GRANT INSERT, UPDATE (${writable.join(', ')}) ON ${tb.id} TO ${ROLE[r].db};`);
    if(masked.length) L.push(`-- ${ROLE[r].db}: ${masked.join(', ')} via ${tb.id}_masked view`);
    if(agg.length && !full.length) L.push(`-- ${ROLE[r].db}: aggregate view ${tb.id}_agg only (k>=5 suppression)`);
  });
  cols.filter(c=>c.enc).forEach(c=>L.push(`-- ${c.n}: never granted directly. Read via app.decrypt_pii('${tb.id}.${c.n}', purpose), which checks consent_record and writes audit_log.`));
  return L.join('\n');
}

/* =========================================================
   Schema graph
   ========================================================= */
const svg=d3.select('#graph'); const root=svg.append('g');
const zoom=d3.zoom().scaleExtent([.2,2.6]).on('zoom',e=>root.attr('transform',e.transform));
svg.call(zoom).on('dblclick.zoom',null);
svg.on('click',e=>{ if(e.target===svg.node()){ state.sel=null; renderInspector(); paintGraph(); markMatrix(); } });
const LAYOUT_COLS=[['ta','ob','it','perf','learn'],['ro','hr','priv','ref'],['pay','time','ben','comp','fin','er']];
const CW=206, CH=30, NW=196, NH=22, PADX=12, HEAD=40, GAPY=26, GAPX=56;
let L={nodes:new Map(),clusters:[]};
function computeLayout(){
  const nodes=new Map(), clusters=[]; let x=0;
  const vt=visTables();
  LAYOUT_COLS.forEach(col=>{
    let y=0, maxW=0;
    col.forEach(d=>{
      const items=vt.filter(tb=>tb.d===d); if(!items.length) return;
      const k=items.length>4?2:1, rows=Math.ceil(items.length/k);
      const w=k*CW+PADX*2-(CW-NW), h=HEAD+rows*CH+10;
      clusters.push({d,x,y,w,h,n:items.length});
      items.forEach((tb,i)=>{ const cx=i%k, ry=Math.floor(i/k); nodes.set(tb.id,{x:x+PADX+cx*CW, y:y+HEAD+ry*CH, w:NW, h:NH, tb}); });
      y+=h+GAPY; maxW=Math.max(maxW,w);
    });
    x+=maxW+GAPX;
  });
  return {nodes,clusters};
}
let edges=[];
function edgePath(s,t){
  const sx=s.x+s.w/2, sy=s.y+s.h/2, tx=t.x+t.w/2, ty=t.y+t.h/2;
  if(Math.abs(sx-tx)<CW*1.6 && Math.abs(s.x-t.x)<CW*1.6 && Math.abs(sx-tx)<10){
    const lx=s.x-4, off=24+Math.min(60,Math.abs(sy-ty)*.25);
    return `M${lx},${sy} C${lx-off},${sy} ${lx-off},${ty} ${lx},${ty}`;
  }
  const right = tx>sx;
  const x1 = right? s.x+s.w : s.x, x2 = right? t.x : t.x+t.w;
  const mx=(x1+x2)/2;
  return `M${x1},${sy} C${mx},${sy} ${mx},${ty} ${x2},${ty}`;
}
function drawGraph(){
  root.selectAll('*').remove();
  L=computeLayout();
  const cg=root.append('g');
  L.clusters.forEach(c=>{
    const g=cg.append('g').attr('class','cluster');
    g.append('rect').attr('x',c.x).attr('y',c.y).attr('width',c.w).attr('height',c.h).attr('rx',10)
      .style('fill',`color-mix(in srgb, var(--d-${c.d}) 7%, transparent)`).style('stroke',`color-mix(in srgb, var(--d-${c.d}) 38%, transparent)`);
    g.append('text').attr('class','cl-label').attr('x',c.x+PADX).attr('y',c.y+24).style('fill',`var(--d-${c.d})`).text(DOM[c.d].label);
    g.append('text').attr('class','cl-count').attr('x',c.x+c.w-PADX).attr('y',c.y+24).attr('text-anchor','end').text(c.n);
  });
  edges=[];
  visTables().forEach(tb=>visCols(tb).forEach(c=>{
    if(!c.fk || c.fk==='tenant' || c.fk===tb.id) return;
    if(!L.nodes.has(c.fk)) return;
    edges.push({s:tb.id,t:c.fk,c:c.n});
  }));
  root.append('g').attr('class','edges').selectAll('path').data(edges).join('path').attr('class','edge')
    .attr('d',e=>edgePath(L.nodes.get(e.s),L.nodes.get(e.t)));
  root.append('g').attr('class','flowlayer');
  const ng=root.append('g').selectAll('g').data([...L.nodes.values()]).join('g')
    .attr('class','node').attr('transform',n=>`translate(${n.x},${n.y})`).attr('tabindex',0).attr('role','button')
    .attr('aria-label',n=>n.tb.id)
    .on('click',(e,n)=>{ e.stopPropagation(); select(n.tb.id); })
    .on('keydown',(e,n)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(n.tb.id); } })
    .on('mouseenter',(e,n)=>{ state.hover=n.tb.id; paintGraph(); })
    .on('mouseleave',()=>{ state.hover=null; paintGraph(); });
  ng.append('rect').attr('class','box').attr('width',NW).attr('height',NH).attr('rx',4);
  ng.append('rect').attr('width',3).attr('height',NH).attr('rx',1.5).style('fill',n=>`var(--d-${n.tb.d})`);
  ng.append('text').attr('class','nm').attr('x',10).attr('y',NH/2+4).text(n=>n.tb.id);
  ng.append('text').attr('class','gl').attr('x',NW-8).attr('y',NH/2+4).attr('text-anchor','end');
  ng.append('circle').attr('class','sens').attr('cx',NW-11).attr('cy',NH/2).attr('r',4);
  const b=ng.append('g').attr('class','badge').style('display','none').attr('transform',`translate(-4,-4)`);
  b.append('circle').attr('r',8); b.append('text');
  paintGraph();
}
function neighbors(id){ const s=new Set([id]); edges.forEach(e=>{ if(e.s===id) s.add(e.t); if(e.t===id) s.add(e.s); }); return s; }
function paintGraph(){
  const focus=state.hover||state.sel; const nb=focus?neighbors(focus):null;
  const flow=state.flow?FLOWS.find(f=>f.id===state.flow):null;
  const flowIdx=new Map(); if(flow) flow.steps.forEach((s,i)=>{ if(!flowIdx.has(s[0])) flowIdx.set(s[0],i+1); });
  const q=state.q;
  root.selectAll('.node').each(function(n){
    const g=d3.select(this), tb=n.tb;
    let op=1;
    if(state.lens){ const l=effLevel(tb,state.lens); op=[.16,.45,.72,1,1][l]; }
    if(flow) op = flowIdx.has(tb.id)?1:.12;
    else if(nb && !nb.has(tb.id)) op=Math.min(op,.3);
    g.style('opacity',op);
    g.classed('sel',state.sel===tb.id);
    const m = q && (tb.id.includes(q) || visCols(tb).some(c=>c.n.includes(q)));
    g.classed('match',!!m);
    const gl=g.select('text.gl'), dot=g.select('circle.sens');
    if(state.lens){ const l=effLevel(tb,state.lens); gl.text(LV[l].g).style('fill', l>=3?'var(--accent)':'var(--faint)'); dot.style('display','none'); }
    else { gl.text(''); dot.style('display',null).style('fill',`var(--c-${maxClass(tb)})`); }
    const bd=g.select('.badge');
    if(flow && flowIdx.has(tb.id)){ bd.style('display',null); bd.select('text').text(flowIdx.get(tb.id)); } else bd.style('display','none');
  });
  root.selectAll('.edge').attr('class',e=>{
    let c='edge';
    if(flow) return c+' dim';
    if(focus){ if(e.s===focus||e.t===focus) c+=' hot'; else c+=' dim'; }
    return c;
  }).style('display',e=>state.hideEmp && e.t==='employee' && !(focus && (e.s===focus||e.t===focus)) ? 'none':null);
  const fl=root.select('.flowlayer'); fl.selectAll('*').remove();
  if(flow){
    const seq=[]; flow.steps.forEach(s=>{ if(L.nodes.has(s[0]) && seq[seq.length-1]!==s[0]) seq.push(s[0]); });
    for(let i=0;i<seq.length-1;i++){ const a=L.nodes.get(seq[i]), b=L.nodes.get(seq[i+1]); fl.append('path').attr('class','flowpath').attr('d',edgePath(a,b)); }
  }
  const chip=document.getElementById('traceChip');
  chip.innerHTML = flow ? `<button class="chip-trace" id="clearTrace">Tracing: ${esc(flow.name)} (clear)</button>` : '';
  if(flow) document.getElementById('clearTrace').onclick=()=>{ state.flow=null; paintGraph(); };
}
function fit(pad=24){
  const el=svg.node(); const W=el.clientWidth||900, H=el.clientHeight||600;
  const bb=root.node().getBBox(); if(!bb.width) return;
  const top=(document.querySelector('.overlay.tl').offsetHeight||40)+22;
  const k=Math.min(2,(W-pad*2)/bb.width,(H-top-pad)/bb.height);
  const tx=(W-bb.width*k)/2-bb.x*k, ty=top+(H-top-pad-bb.height*k)/2-bb.y*k;
  svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
}
function zoomToCluster(d){
  const c=L.clusters.find(x=>x.d===d); if(!c) return;
  const el=svg.node(); const W=el.clientWidth, H=el.clientHeight;
  const k=Math.min(1.6,(W-80)/c.w,(H-80)/c.h);
  svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(W/2-(c.x+c.w/2)*k,H/2-(c.y+c.h/2)*k).scale(k));
}
document.getElementById('fit').onclick=()=>fit();
const hb=document.getElementById('hideEmp');
hb.onclick=()=>{ state.hideEmp=!state.hideEmp; hb.classList.toggle('on',state.hideEmp); hb.setAttribute('aria-pressed',state.hideEmp); paintGraph(); };

  }
}

    <h3>Referenced by (${inFk.length})</h3>
    <ul class="list">${inFk.map(x=>`<li><button class="link" data-go="${x.t}">${esc(x.t)}</button>.<span class="mono">${esc(x.c)}</span></li>`).join('')||'<li>None</li>'}</ul>
    <details><summary>Postgres DDL, RLS and column grants (draft)</summary><pre class="ddl">${esc(ddl(tb))}</pre></details>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  el.scrollTop=0;
}

/* =========================================================
   Access pane
   ========================================================= */
function renderAccess(){
  const el=document.getElementById('pane-access');
  const tiers=[
    ['Platform (Daydor)',['A','O'],'Admin builds the platform; ops runs tenants it is assigned to.'],
    ['Tenant (client company)',['F'],'Approver of record for the whole company.'],
    ['Tenant specialists',['H','P','I'],'Peers, not a chain: each is deep in its own domain and shallow elsewhere.'],
    ['Scoped people',['M','E'],'Manager sees a reporting subtree; employee sees self.'],
    ['Lateral',['U','G'],'Auditor is read-only and time-boxed. Agents follow the worker map.']
  ];
  el.innerHTML = `<div class="access-wrap">
    <h2 class="section-h">Who sits where</h2>
    <p class="section-p">Access narrows as you go down, but it is not a strict superset: the founder outranks HR yet sees less restricted PII, and Daydor admin outranks everyone yet sees no people data. Pick a role to view the map, matrix and inspector through it.</p>
    <div class="ladder">${tiers.map(([n,rs,d])=>`<div class="tier">${esc(n)}</div><div class="roles">${rs.map((r,i)=>`${i&&n.startsWith('Platform')?'<span class="arrow">then</span>':''}<button class="rchip${state.lens===r?' on':''}" data-r="${r}">${esc(ROLE[r].name)}<small>${esc(scopeOf(r,TB.payslip))}</small></button>`).join('')}<span class="section-p" style="margin:0;font-size:.76rem">${esc(d)}</span></div>`).join('')}</div>
    <h2 class="section-h">Column ceilings by sensitivity class</h2>
    <p class="section-p">Every column is tagged with a class. A role\u2019s access to a column is the lower of its table grant and this ceiling, so a manager with read on employee still cannot see pan_encrypted.</p>
    <div style="overflow-x:auto"><table class="caps"><thead><tr><th>Role</th>${CLASS_ORDER.map(c=>`<th><span class="cl" style="background:var(--c-${c})">${c}</span> ${CLASSES[c].label}</th>`).join('')}</tr></thead>
    <tbody>${ROLES.map(r=>`<tr${state.lens===r.id?' style="background:var(--accent-soft)"':''}><td class="rl">${esc(r.name)}</td>${CLASS_ORDER.map(c=>`<td><span class="lvcell${CAPS[r.id][c]===2?' lv2pat':''}" style="${CAPS[r.id][c]===2?'':lvStyle(CAPS[r.id][c])}" title="${LV[CAPS[r.id][c]].label}">${LV[CAPS[r.id][c]].g}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <h2 class="section-h">Table grants</h2>
    <p class="section-p">Each cell is the best access that role has to any column in the table. Select a cell to open the column-level breakdown for that role.</p>
    <div class="legend-row" style="font-size:.76rem;color:var(--soft);margin-bottom:.5rem">${LV.map((l,i)=>`<span><span class="lvcell${i===2?' lv2pat':''}" style="${i===2?'':lvStyle(i)}">${l.g}</span> ${l.label}</span>`).join('')}</div>
    <div class="matrix-scroll"><table class="matrix" id="matrix"><thead><tr><th class="tn">Table</th>${ROLES.map(r=>`<th data-col="${r.id}">${esc(r.short).replace('\n','<br>')}</th>`).join('')}</tr></thead><tbody>
    ${DOM_ORDER.map(d=>{ const rows=visTables().filter(tb=>tb.d===d); if(!rows.length) return '';
      return `<tr class="grp"><td colspan="${ROLES.length+1}" style="color:var(--d-${d})">${esc(DOM[d].label)}</td></tr>`+
      rows.map(tb=>`<tr data-t="${tb.id}"><td class="tn">${esc(tb.id)}</td>${RID.map(r=>{const l=effLevel(tb,r); return `<td class="c" data-col="${r}"><button data-t="${tb.id}" data-r="${r}" class="${l===2?'lv2pat':''}" style="${l===2?'':lvStyle(l)}" title="${esc(ROLE[r].name)} on ${tb.id}: ${LV[l].label}, ${esc(scopeOf(r,tb))}">${LV[l].g}</button></td>`;}).join('')}</tr>`).join('');
    }).join('')}</tbody></table></div></div>`;
  el.querySelectorAll('.rchip').forEach(b=>b.onclick=()=>setLens(state.lens===b.dataset.r?'':b.dataset.r));
  el.querySelectorAll('#matrix button').forEach(b=>b.onclick=()=>{ state.lens=b.dataset.r; lensSel.value=b.dataset.r; state.sel=b.dataset.t; refreshAll(); });
  markMatrix();
}
function markMatrix(){
  document.querySelectorAll('#matrix tr[data-t]').forEach(tr=>tr.classList.toggle('selrow',tr.dataset.t===state.sel));
  document.querySelectorAll('#matrix [data-col]').forEach(c=>c.classList.toggle('lenscol',c.dataset.col===state.lens));
}

/* =========================================================
   Flows pane
   ========================================================= */
function renderFlows(){
  const el=document.getElementById('pane-flows');
  const f=FLOWS.find(x=>x.id===state.flowSel);
  el.innerHTML = `<div class="flows">
    <div class="flowlist">${FLOWS.map(x=>`<button data-f="${x.id}" class="${x.id===f.id?'on':''}"><b>${esc(x.name)}</b><span>${esc(x.sum)}</span></button>`).join('')}</div>
    <div>
      <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem">
        <h2 class="section-h" style="margin:0">${esc(f.name)}</h2>
        <button class="btn on" id="trace">Trace on schema map</button>
      </div>
      <ol class="steps">${f.steps.map(s=>{ const tb=TB[s[0]]; const hidden=!visTables().includes(tb); const g=s[4]?GATE[s[4]]:null;
        const lvl=state.lens?effLevel(tb,state.lens):null;
        return `<li style="${hidden?'opacity:.4':''}"><div><div class="top">
          <button class="tchip" data-t="${s[0]}" style="border-color:var(--d-${tb.d})">${esc(s[0])}</button>
          <span class="op ${s[1]}">${s[1]==='W'?'Writes':s[1]==='R'?'Reads':'Approves'}</span>
          <span class="mono" style="font-size:.74rem;color:var(--soft)">${esc(s[2])}</span>
          ${g?`<span class="tag" style="border-color:var(--c-C3)">Gate: ${esc(g.label)}</span>`:''}
          ${lvl!==null?`<span class="tag">${esc(ROLE[state.lens].name)}: ${LV[lvl].label.toLowerCase()}</span>`:''}
          ${hidden?'<span class="tag">Not in this jurisdiction pack</span>':''}
        </div>${s[3]?`<div class="note">${esc(s[3])}</div>`:''}</div></li>`; }).join('')}</ol>
    </div></div>`;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ state.flowSel=b.dataset.f; if(state.flow) state.flow=b.dataset.f; renderFlows(); paintGraph(); });
  el.querySelectorAll('.tchip').forEach(b=>b.onclick=()=>select(b.dataset.t));
  el.querySelector('#trace').onclick=()=>{ state.flow=f.id; setTab('schema'); paintGraph(); fit(); };
}

/* =========================================================
   Coverage pane
   ========================================================= */
function bars(rows,legend){
  const max=Math.max(...rows.map(r=>r.segs.reduce((s,x)=>s+x.v,0)),1);
  return `<div class="bars">${rows.map((r,i)=>{ const tot=r.segs.reduce((s,x)=>s+x.v,0);
    return `<div class="bar" data-i="${i}" role="button" tabindex="0"><span>${esc(r.label)}</span><div class="track" style="width:${Math.max(4,tot/max*100)}%">${r.segs.filter(s=>s.v).map(s=>`<span class="${s.cls||''}" style="width:${s.v/tot*100}%;background:${s.color}" title="${esc(s.k)}: ${s.v}"></span>`).join('')}</div><span class="n">${tot}</span></div>`; }).join('')}</div>
    <div class="legend-row">${legend.map(l=>`<span><span class="sw ${l.cls||''}" style="background:${l.color}"></span>${esc(l.k)}</span>`).join('')}</div>`;
}
function renderCoverage(){
  const el=document.getElementById('pane-coverage');
  const vt=visTables();
  const domRows=DOM_ORDER.filter(d=>vt.some(tb=>tb.d===d)).map(d=>({label:DOM[d].label,d,segs:CLASS_ORDER.map(c=>({k:CLASSES[c].label,v:vt.filter(tb=>tb.d===d&&maxClass(tb)===c).length,color:`var(--c-${c})`}))}));
  const roleRows=ROLES.map(r=>({label:r.name,r:r.id,segs:[4,3,2,1].map(l=>({k:LV[l].label,v:vt.filter(tb=>effLevel(tb,r.id)===l).length,color:l===2?'var(--lv3)':`var(--lv${l})`,cls:l===2?'lv2pat':''}))}));
  const srcRows=Object.keys(SRC).map(s=>({label:SRC[s],segs:DOM_ORDER.map(d=>({k:DOM[d].label,v:vt.filter(tb=>tb.src===s&&tb.d===d).length,color:`var(--d-${d})`}))}));
  const colRows=CLASS_ORDER.map(c=>({label:CLASSES[c].label,segs:[{k:'Shared core',v:vt.reduce((s,tb)=>s+visCols(tb).filter(x=>x.cl===c&&!x.j&&!tb.j).length,0),color:'var(--accent)'},{k:'India pack',v:vt.reduce((s,tb)=>s+visCols(tb).filter(x=>x.cl===c&&(x.j==='IN'||tb.j==='IN')).length,0),color:'var(--d-pay)'},{k:'US pack',v:vt.reduce((s,tb)=>s+visCols(tb).filter(x=>x.cl===c&&(x.j==='US'||tb.j==='US')).length,0),color:'var(--d-it)'}]}));
  el.innerHTML = `<div class="cov">
    <div class="chart"><h2 class="section-h">Tables per domain, by most sensitive column</h2><p class="section-p">Select a domain to zoom to it on the map.</p><div id="ch1">${bars(domRows,CLASS_ORDER.map(c=>({k:CLASSES[c].label,color:`var(--c-${c})`})))}</div></div>
    <div class="chart"><h2 class="section-h">How far each role reaches</h2><p class="section-p">Tables each role can touch at all, split by its best access. Select a role to open the matrix through its lens.</p><div id="ch2">${bars(roleRows,[4,3,2,1].map(l=>({k:LV[l].label,color:l===2?'var(--lv3)':`var(--lv${l})`,cls:l===2?'lv2pat':''})))}</div></div>
    <div class="chart"><h2 class="section-h">Columns by class and jurisdiction pack</h2><p class="section-p">Where the restricted and special-category columns live, and how much of the model is market-specific.</p><div id="ch4">${bars(colRows,[{k:'Shared core',color:'var(--accent)'},{k:'India pack',color:'var(--d-pay)'},{k:'US pack',color:'var(--d-it)'}])}</div></div>
    <div class="chart"><h2 class="section-h">Where each table came from</h2><p class="section-p">Coloured by domain. All seven gap-analysis additions (position, skill, employee_skill, work_authorization, self_identification, emergency_contact, tax residency on payroll_profile) plus job_profile and comp_band are in.</p><div id="ch3">${bars(srcRows,[])}</div></div>
    <div class="chart"><h2 class="section-h">Decisions I made that you should confirm</h2>
      <ol class="decisions">${DECISIONS.map(([h,p])=>`<li><b>${esc(h)}</b><p>${esc(p)}</p></li>`).join('')}</ol></div>
  </div>`;
  const wire=(id,rows,fn)=>el.querySelectorAll(`#${id} .bar`).forEach(b=>{ const go=()=>fn(rows[+b.dataset.i]); b.onclick=go; b.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
  wire('ch1',domRows,r=>{ setTab('schema'); requestAnimationFrame(()=>zoomToCluster(r.d)); });
  wire('ch2',roleRows,r=>{ setLens(r.r); setTab('access'); });
}

/* =========================================================
   Boot
   ========================================================= */
function refreshAll(){ updateLead(); renderLegend(); paintGraph(); renderInspector(); renderAccess(); renderFlows(); renderCoverage(); }
drawGraph(); refreshAll();
requestAnimationFrame(()=>{ fit(); state.fitted=true; });
window.addEventListener('resize',()=>{ if(state.tab==='schema') fit(); });
</script>
</body>
</html>
