# NOT RUN YET: written alongside FE-0 but never executed on GitHub. Set the repository variable
# DAYDOR_BACKEND_REPO (owner/name) and secret BACKEND_REPO_TOKEN (read access) before first use.
name: ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run contract
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: daydor_owner, POSTGRES_PASSWORD: dev }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daydor_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAYDOR_API_TEST_DATABASE_URL: postgresql+psycopg://daydor_owner:dev@localhost:5432/daydor_api_test
      DAYDOR_BACKEND_ROOT: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DAYDOR_BACKEND_REPO }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -e backend -e "api[dev]"
      - run: cd api && pytest

  contract-drift:
    # Fails when the backend's model or enum values changed and this repo's copies were not refreshed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DAYDOR_BACKEND_REPO }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e backend -e api
      - run: cd api && python scripts/gen_enums.py ../backend
      - run: cd frontend && npm ci && DAYDOR_BACKEND_ROOT=../backend npm run contract:sync
      - run: git diff --exit-code
