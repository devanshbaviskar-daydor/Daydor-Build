[project]
name = "daydor-api"
version = "0.1.0"
description = "Thin HTTP layer over the Daydor backend: sign-in, role-scoped reads and writes, flow actions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]
# The `daydor` backend package is NOT a PyPI dependency. Install it first:
#   pip install -e /path/to/daydor-backend

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daydor_api = ["sql/*.sql", "enums/*.json", "frontdoor/*.json", "frontdoor/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
